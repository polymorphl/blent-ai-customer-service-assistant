[project]
name = "blent-ai-customer-service-assistant"
version = "0.1.0"
description = "LangChain-based chatbot that answers e-commerce order questions in natural language by querying a SQL database in real time."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.2.17",
    "langchain-mistralai>=1.1.3",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
